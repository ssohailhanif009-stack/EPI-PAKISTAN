<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Leave Request & Approval Portal - EPI Pakistan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #333; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; margin-bottom: 25px; backdrop-filter: blur(5px); }
        h2 { color: #1b4d3e; margin-bottom: 5px; font-size: 22px; }
        .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #1b4d3e; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; background: #fafafa; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #1b4d3e; background: #fff; }
        input[readonly], select:disabled { background-color: #e9ecef; color: #495057; cursor: not-allowed; border-color: #ced4da; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; background-color: #1b4d3e; color: white; font-size: 15px; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background-color: #14382c; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #fff; background: #1b4d3e; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 13px; }
        
        /* Leave Status Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 13px; }
        th { background-color: #1b4d3e; color: white; }
        .status-pending { color: #d97706; font-weight: bold; }
        .status-approved { color: #059669; font-weight: bold; }
        .status-rejected { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <a href="vaccinator.html" class="back-link">&larr; Back to Dashboard</a>
        <h2>Staff Leave Application Portal</h2>
        <p class="subtitle">EPI Civil Hospital Naushahro Feroze</p>

        <form id="leaveForm">
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Staff Name</label>
                    <input type="text" id="staffName" readonly required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>EPI Center / Designation</label>
                    <input type="text" id="staffCenter" readonly required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Leave Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Leave End Date</label>
                    <input type="date" id="endDate" required>
                </div>
            </div>

            <div class="form-group">
                <label>Reason for Leave</label>
                <textarea id="leaveReason" rows="3" placeholder="Enter detailed reason for leave..." required></textarea>
            </div>

            <div class="form-group">
                <label>Supporting Document / Application Picture (Optional)</label>
                <input type="file" id="leaveDocImg" accept="image/*" capture="environment">
            </div>

            <button type="submit" class="btn" id="submitLeaveBtn">Submit Leave Request</button>
        </form>
    </div>

    <!-- My Leave Status Card -->
    <div class="card">
        <h2>My Leave Application Status History</h2>
        <p class="subtitle">Track approval status from Admin / TSV</p>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Applied Date</th>
                        <th>From - To</th>
                        <th>Reason</th>
                        <th>Status</th>
                    </tr>
                 sweeteners
                    <tr id="noLeaveRow">
                        <td colspan="4" style="text-align: center; color: #777;">No leave applications found.</td>
                    </tr>
                </thead>
                <tbody id="leaveHistoryTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClwlrw3urCt5vBWEd7imLZ6mGRQczDffI",
            authDomain: "epi-portal.firebaseapp.com",
            projectId: "epi-portal",
            storageBucket: "epi-portal.firebasestorage.app",
            messagingSenderId: "513980526499",
            appId: "1:513980526499:web:5b3a1cfe761f93a0767416",
            measurementId: "G-5JQZ3W8WWK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('currentUser'));

        window.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                document.getElementById('staffName').value = currentUser.fullName || '';
                document.getElementById('staffCenter').value = (currentUser.epiCenter || '') + ' (' + (currentUser.designation || 'Vaccinator') + ')';
                loadLeaveHistory();
            } else {
                alert("No active session found. Please login first.");
                window.location.href = "index.html";
            }
        });

        // Image compression function for leave document image (Firestore 1MB Limit Prevention)
        const readFileAsDataURL = (file) => {
            return new Promise((resolve) => {
                if (!file) { resolve(''); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    }
                };
                reader.readAsDataURL(file);
            });
        };

        document.getElementById('leaveForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitLeaveBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Compressing & Submitting...';

            let docFile = document.getElementById('leaveDocImg').files[0];
            let compressedImg = await readFileAsDataURL(docFile);

            let leaveData = {
                staffName: currentUser.fullName,
                epiCenter: currentUser.epiCenter || 'N/A',
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                reason: document.getElementById('leaveReason').value,
                leaveDocImg: compressedImg,
                status: 'Pending', // Pending, Approved, Rejected
                appliedAt: new Date().toISOString().split('T')[0]
            };

            try {
                await addDoc(collection(db, 'epi_leave_requests'), leaveData);
                
                // Also save locally as backup
                let localLeaves = JSON.parse(localStorage.getItem('epi_leave_requests')) || [];
                localLeaves.push(leaveData);
                localStorage.setItem('epi_leave_requests', JSON.stringify(localLeaves));

                alert('Leave request submitted successfully!');
                location.reload();
            } catch (error) {
                console.error("Error submitting leave: ", error);
                alert("Failed to submit leave: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Leave Request';
            }
        });

        async function loadLeaveHistory() {
            let tbody = document.getElementById('leaveHistoryTableBody');
            tbody.innerHTML = '';
            
            try {
                let q = query(collection(db, 'epi_leave_requests'), where("staffName", "==", currentUser.fullName));
                let querySnapshot = await getDocs(q);
                
                let leaves = [];
                querySnapshot.forEach((doc) => {
                    leaves.push(doc.data());
                });

                // Fallback to local storage if firebase is empty or offline
                if (leaves.length === 0) {
                    let localLeaves = JSON.parse(localStorage.getItem('epi_leave_requests')) || [];
                    leaves = localLeaves.filter(l => l.staffName === currentUser.fullName);
                }

                if (leaves.length > 0) {
                    document.getElementById('noLeaveRow').style.display = 'none';
                    leaves.forEach(leave => {
                        let statusClass = 'status-pending';
                        if(leave.status === 'Approved') statusClass = 'status-approved';
                        if(leave.status === 'Rejected') statusClass = 'status-rejected';

                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${leave.appliedAt || 'N/A'}</td>
                            <td>${leave.startDate} to ${leave.endDate}</td>
                            <td>${leave.reason}</td>
                            <td class="${statusClass}">${leave.status}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                console.error("Error loading leave history: ", e);
            }
        }
    </script>
</body>
</html>
